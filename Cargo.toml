[package]
name = "git-barber"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Trim stale merged git branches (classic + squash merges), with a TUI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rekurt/git-barber"
readme = "README.md"
keywords = ["git", "branch", "cleanup", "tui", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/assets", "/.github"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
strip = true
